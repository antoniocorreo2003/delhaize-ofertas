name: Ofertas Delhaize
on:
  schedule:
    - cron: "23 */2 * * *"   # cada 2 h: sincroniza favoritos; la descarga completa es 1 vez al día (≥ 6:00)
  workflow_dispatch:
    inputs:
      forzar:
        description: Descargar las ofertas ahora
        type: boolean
        default: false
permissions:
  contents: write
concurrency: ofertas
jobs:
  ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Brussels
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ofertas.py ${{ inputs.forzar && '--forzar' || '' }}
      - name: Guardar
        run: |
          git config user.name "bot-ofertas"
          git config user.email "bot-ofertas@users.noreply.github.com"
          git add estado.json docs/
          git diff --cached --quiet || (git commit -m "ofertas $(date +%d/%m\ %H:%M)" && git pull --rebase && git push)
